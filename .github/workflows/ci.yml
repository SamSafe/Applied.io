name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:deps
      # The worker serves the SPA's build output, so build it before typechecking/testing the worker.
      - run: pnpm --filter @apptracker/web build
      - run: pnpm typecheck
      - run: pnpm test
